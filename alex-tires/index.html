<style>
:root{--ink:#141210;--ink-2:#5B524A;--salsa:#E23B2E;--wall:#FFD23F;--page:#FFFFFF;--card:#FFFFFF;--line:#ECE4D8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#F5EFE6;--ink-2:#B9AE9F;--page:#141210;--card:#1E1A16;--line:#332C25;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#F5EFE6;--ink-2:#B9AE9F;--page:#141210;--card:#1E1A16;--line:#332C25;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--page);color:var(--ink);font-family:"Figtree",ui-sans-serif,system-ui,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.bar{height:10px;background:var(--wall);border-bottom:3px solid #141210}
main{flex:1;display:grid;place-items:center;padding:2.5rem 16px}
.card{width:100%;max-width:420px;text-align:center}
.logo{display:inline-flex;gap:.55rem;font-family:"Bungee",Impact,sans-serif;font-size:1.25rem;text-transform:uppercase;border:4px solid var(--ink);border-radius:999px;padding:.3rem 1.05rem .26rem;color:var(--ink);text-decoration:none}
.logo b{font-weight:400;color:var(--salsa);margin-left:-.1rem}
h1{font-family:"Bungee",Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(1.7rem,1.3rem + 2vw,2.3rem);line-height:1.05;margin:1.8rem 0 .7rem}
p{margin:0;color:var(--ink-2)}
form{margin-top:1.8rem;display:grid;gap:.8rem}
input{font:800 1.6rem/1 "Figtree",ui-sans-serif,system-ui,sans-serif;letter-spacing:.5em;text-align:center;padding:.8rem 1rem .8rem 1.5rem;border:3px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink);width:100%;min-height:60px}
input:focus{outline:3px solid var(--salsa);outline-offset:3px}
button{font:800 1.05rem "Figtree",ui-sans-serif,system-ui,sans-serif;min-height:54px;border-radius:999px;border:3px solid #141210;background:var(--salsa);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{min-height:1.5em;color:var(--salsa);font-weight:700}
.help{margin-top:2rem;font-size:.92rem}
.help a{color:inherit;font-weight:700}
</style>

<script>
(function(){
  var P = JSON.parse(document.getElementById('payload').textContent);

  // Visit tracking: lets Web Burrito see when this preview is opened (functions/index.js).
  // A random id per browser and per tab; no cookies, no IP address stored.
  var slug=location.pathname.split('/')[1]||'';
  function rid(){var s='';try{var b=crypto.getRandomValues(new Uint8Array(12));for(var i=0;i<b.length;i++)s+=('0'+b[i].toString(16)).slice(-2);}catch(e){s=Math.random().toString(36).slice(2)+Date.now().toString(36);}return s;}
  function keep(kind,key,make){try{var st=window[kind],v=st.getItem(key);if(!v&&make){v=make();st.setItem(key,v);}return v;}catch(e){return make?make():null;}}
  var visitor=keep('localStorage','wb-vid',rid), session=keep('sessionStorage','wb-sid',rid);
  var ref=(/[?&]r=([^&#]*)/.exec(location.search)||[])[1]||null, tz=null;
  try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone;}catch(e){}
  function track(event,extra){
    try{
      var d={event:event,slug:slug,visitor:visitor,session:session,internal:keep('localStorage','wb-internal')==='1',
             ref:ref&&decodeURIComponent(ref),tz:tz,referrer:String(document.referrer).slice(0,300)};
      for(var k in extra||{})d[k]=extra[k];
      var body=JSON.stringify(d);
      if(navigator.sendBeacon&&navigator.sendBeacon('/api/track',body))return;
      fetch('/api/track',{method:'POST',body:body,keepalive:true}).catch(function(){});
    }catch(e){}
  }
  // After unlock: seconds spent on the site while the tab is visible, and how far they scrolled.
  function watch(){
    var since=Date.now(), total=0, depth=0, sent=0;
    function scrolled(){var h=document.documentElement,room=h.scrollHeight-window.innerHeight,p=room>0?Math.round(100*(window.scrollY||h.scrollTop)/room):100;if(p>depth)depth=Math.min(100,p);}
    function pause(){if(since){total+=Date.now()-since;since=0;}}
    function flush(){var s=Math.round(total/1000);if(s>sent){sent=s;track('time',{seconds:s,scroll:depth});}}
    window.addEventListener('scroll',scrolled,{passive:true});
    document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'){pause();flush();}else if(!since){since=Date.now();}});
    window.addEventListener('pagehide',function(){pause();flush();});
    setTimeout(scrolled,500);
  }

  function bytes(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
  function unlock(code){
    var enc=new TextEncoder();
    return crypto.subtle.importKey('raw',enc.encode(code),'PBKDF2',false,['deriveKey'])
      .then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(P.salt),iterations:P.iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);})
      .then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(P.iv)},key,bytes(P.ct));})
      .then(function(buf){
        if(P.z!=='gz')return buf;
        if(!window.DecompressionStream)throw new Error('nods');
        var ds=new DecompressionStream('gzip'),w=ds.writable.getWriter();
        w.write(new Uint8Array(buf));w.close();
        return new Response(ds.readable).arrayBuffer();
      })
      .then(function(buf){return new TextDecoder().decode(buf);});
  }
  // document.open() drops event listeners, so watch() starts after the site is written.
  function show(html,code){track('unlock');document.open();document.write(html);document.close();window.scrollTo(0,0);watch();offer(code);}
  // Once sign-ups are open (webburrito.com/app/), the banner takes the owner straight to it.
  function offer(code){
    fetch('/api/app/config').then(function(r){return r.ok?r.json():null;}).then(function(c){
      if(!c||!c.apiBase||!c.ready||!c.ready.payments||!c.ready.hosting||!c.ready.domains)return;
      // In test mode (Square sandbox) only your own devices see it, for trying the flow.
      if(c.testMode&&keep('localStorage','wb-internal')!=='1')return;
      var bar=document.querySelector('.wb-concept,.dj-concept');if(!bar)return;
      var note=bar.lastElementChild;
      if(note&&/not live yet/i.test(note.textContent))note.textContent=note.textContent.replace(/not live yet.*$/i,'Not live yet: put it online on your own .com today.');
      var a=document.createElement('a');
      a.href='/app/?claim='+encodeURIComponent(slug);a.textContent='Make it mine';
      a.setAttribute('style','display:inline-block;margin-left:.7rem;padding:.3rem 1rem;border-radius:999px;background:#FFD23F;color:#141210;font-weight:800;text-decoration:none;white-space:nowrap');
      a.addEventListener('click',function(){try{localStorage.setItem('wb-claim',JSON.stringify({slug:slug,code:code,at:Date.now()}));}catch(e){}track('claim');});
      bar.appendChild(a);
    }).catch(function(){});
  }
  var f=document.getElementById('f'), input=document.getElementById('code'), go=document.getElementById('go'), err=document.getElementById('err');
  track('load');
  if(!window.crypto||!crypto.subtle){err.textContent='Please open this link in Safari or Chrome.';go.disabled=true;return;}
  var saved=null; try{saved=sessionStorage.getItem('wb-preview-code');}catch(e){}
  if(saved){unlock(saved).then(function(html){show(html,saved);},function(){try{sessionStorage.removeItem('wb-preview-code');}catch(e){}});}
  f.addEventListener('submit',function(e){
    e.preventDefault();
    var code=input.value.trim(); if(!code){input.focus();return;}
    go.disabled=true; go.textContent='Opening…'; err.textContent='';
    unlock(code).then(function(html){
      try{sessionStorage.setItem('wb-preview-code',code);}catch(e){}
      show(html,code);
    },function(e){
      var old=e&&e.message==='nods';
      if(!old)track('fail');
      go.disabled=false; go.textContent='Open my preview';
      err.textContent=old?'Please open this link in a newer Safari or Chrome.':"That passcode didn't work. Try again.";
      input.select();
    });
  });
})();
</script>
